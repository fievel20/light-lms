# Light LMS — /etc/nginx/sites-available/light-lms
# Replace lms.example.fr with the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/light-lms /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d lms.example.fr

server {
    listen 80;
    listen [::]:80;
    server_name lms.example.fr;

    # "current" is a symlink to the active release (see deploy/activate.sh).
    root /var/www/light-lms/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have hashed names: cache them for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so a new release is
        # picked up immediately without restarting PHP-FPM.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
