# Light LMS — /etc/apache2/sites-available/light-lms.conf
# The server's other sites keep mod_php 8.3: only this virtual host is
# handed to PHP-FPM 8.4. Installed by deploy/server-setup.sh.

# /var/www/html is also served by the server's other sites: close this folder
# (shared/.env, releases…) to all of them. The virtual host below re-opens
# current/public only. lms.example.fr is replaced by the real domain
# when deploy/server-setup.sh installs this file.
<Directory /var/www/html/light-lms>
    Require all denied
    AllowOverride None
</Directory>

<VirtualHost *:80>
    ServerName lms.example.fr

    # "current" is a symlink to the active release (see deploy/activate.sh).
    DocumentRoot /var/www/html/light-lms/current/public

    <Directory /var/www/html/light-lms/current/public>
        Options FollowSymLinks
        # Laravel's public/.htaccess routes every request to index.php.
        AllowOverride All
        Require all granted
    </Directory>

    # PHP 8.4 (dedicated pool, see deploy/server-setup.sh) for this site only.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/light-lms.sock|fcgi://localhost"
    </FilesMatch>

    # Built assets have hashed names: cache them for a long time.
    <Directory /var/www/html/light-lms/current/public/build>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>

    # Images of the sequences: 5 MB each, plus the form around them (8 MB).
    LimitRequestBody 8388608

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/light-lms-error.log
    CustomLog ${APACHE_LOG_DIR}/light-lms-access.log combined
</VirtualHost>
