# Light LMS — /etc/apache2/sites-available/light-lms.conf
# The server's other sites keep mod_php 8.3: only this virtual host is
# handed to PHP-FPM 8.4. Then:
#   sudo a2enmod proxy_fcgi setenvif rewrite headers expires
#   sudo a2ensite light-lms && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d lms.example.fr

<VirtualHost *:80>
    ServerName lms.example.fr

    # "current" is a symlink to the active release (see deploy/activate.sh).
    DocumentRoot /var/www/light-lms/current/public

    <Directory /var/www/light-lms/current/public>
        Options FollowSymLinks
        # Laravel's public/.htaccess routes every request to index.php.
        AllowOverride All
        Require all granted
    </Directory>

    # PHP 8.4 for this site only, never the global mod_php.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Built assets have hashed names: cache them for a long time.
    <Directory /var/www/light-lms/current/public/build>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>

    LimitRequestBody 2097152

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/light-lms-error.log
    CustomLog ${APACHE_LOG_DIR}/light-lms-access.log combined
</VirtualHost>
