# Light LMS — /etc/supervisor/conf.d/light-lms.conf
# Queue worker: sends the invitation emails. Without it, no email leaves.
#   sudo supervisorctl reread && sudo supervisorctl update

[program:light-lms-worker]
command=php /var/www/light-lms/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/light-lms/shared/storage/logs/worker.log
