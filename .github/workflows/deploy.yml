name: deploy

# Deploys main to the VPS once the "tests" workflow has passed, checks that
# the site answers, and puts the previous release back online if it does not.
# Disabled until the repository variable DEPLOY_ENABLED is set to "true";
# SITE_URL holds the site address, e.g. https://lms.example.fr
# (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      APP_DIR: /var/www/html/light-lms
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Check settings
        run: '[ -n "$SITE_URL" ] || { echo "::error::Variable SITE_URL manquante (Settings → Secrets and variables → Actions → Variables)"; exit 1; }'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build assets
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          npm ci
          npm run build
          rm .env

      - name: Package release
        run: |
          echo "RELEASE=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          rm -rf node_modules tests
          tar --exclude=.git --exclude=.github -czf "$RUNNER_TEMP/release.tgz" .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" "$RUNNER_TEMP/release.tgz" "deploy@$HOST:/tmp/light-lms-$RELEASE.tgz"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "deploy@$HOST" "set -e
            mkdir -p $APP_DIR/releases/$RELEASE
            tar -xzf /tmp/light-lms-$RELEASE.tgz -C $APP_DIR/releases/$RELEASE
            rm /tmp/light-lms-$RELEASE.tgz
            bash $APP_DIR/releases/$RELEASE/deploy/activate.sh $RELEASE"

      # Laravel's /up route boots the framework and answers 200 when it runs.
      - name: Check the site
        id: check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL/up" > /dev/null

      - name: Roll back if the site is down
        if: failure() && steps.check.outcome == 'failure'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: ssh -i ~/.ssh/deploy_key -p "$PORT" "deploy@$HOST" "bash $APP_DIR/current/deploy/rollback.sh"
